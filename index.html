<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <main id="app">
    <section class="view active" id="view-home" aria-label="Inicio">
      <input class="search-fake" id="home-search" type="search" placeholder="Buscar receta…" readonly aria-label="Buscar receta">
      <button class="hero" id="hero" type="button"></button>
      <div class="cats" id="cats" role="tablist" aria-label="Categorías"></div>
      <h2>Recetas populares</h2>
      <div class="grid" id="grid"></div>
    </section>

    <section class="view" id="view-search" aria-label="Búsqueda">
      <header class="bar">
        <button class="icon" type="button" data-act="back" aria-label="Volver">‹</button>
        <div class="field">
          <input id="search-input" type="search" placeholder="Buscar por nombre o ingrediente" autocomplete="off" aria-label="Buscar receta">
          <button class="icon sm" id="search-clear" type="button" aria-label="Limpiar búsqueda">✕</button>
        </div>
      </header>
      <ul class="suggest" id="suggest"></ul>
    </section>

    <section class="view" id="view-detail" aria-label="Detalle de receta">
      <header class="bar">
        <button class="icon" type="button" data-act="back" aria-label="Volver">‹</button>
      </header>
      <div class="ph big" id="d-img"></div>
      <h1 id="d-title"></h1>
      <div class="meta">
        <div><span aria-hidden="true">⏱</span><b id="d-time"></b></div>
        <div><span aria-hidden="true">🍽</span><b id="d-serv"></b></div>
        <div><span aria-hidden="true">📶</span><b id="d-diff"></b></div>
      </div>
      <h2>Ingredientes</h2>
      <div class="stepper" role="group" aria-label="Porciones">
        <span>Porciones:</span>
        <button type="button" data-act="minus" aria-label="Menos porciones">−</button>
        <output id="d-n">4</output>
        <button type="button" data-act="plus" aria-label="Más porciones">+</button>
      </div>
      <ul class="ings" id="d-ings"></ul>
      <button class="btn primary" type="button" data-act="addMissing">Añadir faltantes a Lista de Compras</button>
      <button class="btn" type="button" data-act="steps" id="steps-btn" aria-expanded="false" aria-controls="d-steps">Ver Pasos de Preparación</button>
      <ol class="steps" id="d-steps" hidden></ol>
    </section>

    <section class="view" id="view-list" aria-label="Lista de compras">
      <header class="bar between">
        <h1>Mi Lista de Compras</h1>
        <button class="icon" type="button" data-act="trash" aria-label="Eliminar tachados o vaciar lista">🗑</button>
      </header>
      <input class="search-fake" id="list-search" type="search" placeholder="Buscar en la lista…" aria-label="Buscar en la lista">
      <div id="list-body"></div>
      <button class="btn primary" type="button" data-act="openModal">+ Añadir artículo personalizado</button>
    </section>
  </main>

  <nav class="tabs" id="tabs" aria-label="Navegación principal">
    <button type="button" data-tab="home" class="on"><span aria-hidden="true">🏠</span>Inicio</button>
    <button type="button" data-tab="list"><span aria-hidden="true">🛒</span>Lista de compras</button>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h2 id="m-title">Nuevo artículo</h2>
      <input id="m-input" type="text" maxlength="60" placeholder="Ej: Leche de almendras" autocomplete="off">
      <div class="row">
        <button class="btn" type="button" data-act="closeModal">Cancelar</button>
        <button class="btn primary" type="button" data-act="saveCustom">Añadir</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js"></script>
</body>
</html>
